# hyprpaper config.
# All paths are absolute or ~ expanded. The default wallpaper is expected at
# ~/.local/share/osiris/wallpapers/osiris-default.png. The Phase 2 installer
# creates this directory and copies branding/wallpapers/osiris-default.png there.
# For dev:
#   mkdir -p ~/.local/share/osiris/wallpapers
#   ln -s "$PWD/branding/wallpapers/osiris-default.png" ~/.local/share/osiris/wallpapers/

preload   = ~/.local/share/osiris/wallpapers/osiris-default.png
wallpaper = ,~/.local/share/osiris/wallpapers/osiris-default.png

splash = false
ipc    = on
