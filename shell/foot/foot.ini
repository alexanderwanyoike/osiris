# foot terminal configuration for Osiris.
# Reference: man 5 foot.ini

font=monospace:size=11
dpi-aware=yes

pad=12x12
initial-window-size-pixels=900x600

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=1.0
background=0d0d10
foreground=e8e8e8

# Cursor.
cursor=0d0d10 e8e8e8

# Selection.
selection-foreground=0d0d10
selection-background=7c8aeb

# Regular palette.
regular0=1a1a1f
regular1=e06c75
regular2=98c379
regular3=e5c07b
regular4=7c8aeb
regular5=c678dd
regular6=56b6c2
regular7=e8e8e8

# Bright palette.
bright0=2a2a2f
bright1=ff7b85
bright2=a8d389
bright3=f5d08b
bright4=8c9aff
bright5=d688ed
bright6=66c6d2
bright7=ffffff
