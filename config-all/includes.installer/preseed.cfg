# Osiris OS - Post-Installation Configuration
# This runs automatically after debian-installer completes installation

# Remove live user, live packages, and autologin configuration
d-i preseed/late_command string \
    in-target userdel -r user 2>/dev/null || true; \
    in-target rm -f /etc/lightdm/lightdm.conf.d/10-autologin.conf; \
    in-target rm -f /etc/sudoers.d/user; \
    in-target apt-get -y purge live-config live-config-systemd live-boot live-tools; \
    in-target apt-get -y autoremove --purge; \
    in-target apt-get clean
