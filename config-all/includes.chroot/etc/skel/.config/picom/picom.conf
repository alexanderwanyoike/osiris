# Osiris OS - Picom Configuration
# Compositor for XFCE matching SwayFX aesthetic
# Pure minimalism - grayscale only

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000"

# Don't draw shadows on certain windows
shadow-exclude = [
  "class_g = 'Plank'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Transparency
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;

# Blur
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
  "class_g = 'Plank'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Corners - 12px matching Sway
corner-radius = 12;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Plank'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Backend
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# Window type settings
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; opacity = 1.0; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.95; shadow = true; }
  dropdown_menu = { opacity = 0.95; shadow = true; }
};
