# Osiris Foot Terminal Configuration

[main]
font=JetBrainsMono Nerd Font Mono:size=11
dpi-aware=yes
pad=8x8

[bell]
urgent=no
notify=no

[scrollback]
lines=10000

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=0.75  
foreground=ffffff
background=000000

## Normal colors (Pure Grayscale)
regular0=000000  # black
regular1=666666  # dark gray
regular2=999999  # medium gray
regular3=cccccc  # light gray
regular4=1a1a1a  # near black
regular5=4d4d4d  # mid-dark gray
regular6=808080  # mid gray
regular7=b3b3b3  # bright gray

## Bright colors (Pure Grayscale)
bright0=333333   # bright black
bright1=666666   # bright dark gray
bright2=999999   # bright medium gray
bright3=cccccc   # bright light gray
bright4=1a1a1a   # bright near black
bright5=4d4d4d   # bright mid-dark gray
bright6=808080   # bright mid gray
bright7=ffffff   # white