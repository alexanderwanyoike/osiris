# Osiris Foot Terminal Configuration - Light Mode

[main]
font=JetBrainsMono Nerd Font Mono:size=11
dpi-aware=yes
pad=8x8

[bell]
urgent=no
notify=no

[scrollback]
lines=10000

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=0.75  # ← More transparent (was 0.90)
foreground=000000
background=ffffff

## Normal colors (Pure Grayscale)
regular0=ffffff  # white
regular1=999999  # light gray
regular2=666666  # medium gray
regular3=333333  # dark gray
regular4=f5f5f5  # near white
regular5=b3b3b3  # mid-light gray
regular6=808080  # mid gray
regular7=4d4d4d  # dark-mid gray

## Bright colors (Pure Grayscale)
bright0=cccccc  # bright white
bright1=999999  # bright light gray
bright2=666666  # bright medium gray
bright3=333333  # bright dark gray
bright4=f5f5f5  # bright near white
bright5=b3b3b3  # bright mid-light gray
bright6=808080  # bright mid gray
bright7=000000  # black