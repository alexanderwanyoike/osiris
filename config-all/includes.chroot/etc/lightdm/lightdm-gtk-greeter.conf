[greeter]
# Background - dark wallpaper
background=/usr/share/backgrounds/osiris/osiris-dark.png

# Logo - centered at top
logo=/usr/share/pixmaps/osiris-logo.png

# Disable user background images
user-background=false

# GTK Theme - dark
theme-name=Adwaita-dark
icon-theme-name=Adwaita

# Font
font-name=Sans 11

# Hide user image for minimalist look
show-user-image=false

# Indicators
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power

# Clock format
clock-format=%a %b %d, %H:%M

# Position elements
position=50%,center 50%,center
