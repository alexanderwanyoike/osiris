[greeter]
# Background - light wallpaper
background=/usr/share/backgrounds/osiris/osiris-light.png

# Logo
logo=/usr/share/pixmaps/osiris-logo-light.png

# Disable user background images
user-background=false

# GTK Theme - light
theme-name=Adwaita
icon-theme-name=Adwaita

# Font
font-name=Sans 11

# Hide user image for minimalist look
show-user-image=false

# Indicators
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power

# Clock format
clock-format=%a %b %d, %H:%M

# Position elements
position=50%,center 50%,center
