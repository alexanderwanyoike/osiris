[Greeter]
# Background wallpaper
background=/usr/share/backgrounds/osiris/osiris-dark.png
background-color=#000000

# Logo
logo=/usr/share/pixmaps/osiris-logo-light.png

# Theme
theme-name=Adwaita-dark
icon-theme-name=elementary-Xfce-dark

# Font
font-name=Sans 11

# User backgrounds
draw-user-backgrounds=false

# Show options
show-hostname=false
show-power=true
show-a11y=true
show-keyboard=true
show-clock=true

# Clock format
clock-format=%a %b %d, %H:%M

# Additional settings
activate-numlock=false
enable-hidpi=auto
