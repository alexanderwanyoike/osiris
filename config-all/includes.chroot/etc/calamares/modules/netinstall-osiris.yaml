---
# Osiris OS - Developer-Centric Minimalist Installation Profiles

# Base Profile: Core essentials, Python, C++, PDF reader
- name: "Base Profile"
  description: "Minimal essentials - Python, C++, PDF reader, core tools"
  selected: true
  critical: false
  expanded: true
  subgroups:
    - name: "System Utilities"
      description: "Essential system tools"
      selected: true
      packages:
        - htop
        - gparted
        - nano

    - name: "Basic Development"
      description: "Python and C++ essentials"
      selected: true
      packages:
        - python3
        - python3-pip
        - python3-venv
        - gcc
        - g++
        - make
        - git

    - name: "PDF Reader"
      description: "Lightweight document viewer"
      selected: true
      packages:
        - evince

# Development Profile: Full developer toolchain
- name: "Development Profile"
  description: "Complete dev environment - Python, Node, Rust, Go, Docker, C#"
  selected: false
  critical: false
  expanded: false
  subgroups:
