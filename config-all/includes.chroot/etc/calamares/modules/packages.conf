---
# Osiris OS - Package cleanup configuration for Calamares
# Override the default to handle removal failures gracefully

backend: apt

# Skip package operations on failure to avoid blocking installation
skip_if_no_internet: false
update_db: true
update_system: false

operations:
  - try_remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - live-task-localisation
      - live-task-recommended
      - calamares-settings-debian
