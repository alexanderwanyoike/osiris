# Calamares partition module configuration for Osiris OS
# This file configures automatic and manual partitioning behavior
---

# EFI System Partition configuration
# Required for UEFI boot mode
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 64MiB
    label: "EFI"

# Default filesystem for new partitions
defaultFileSystemType: "ext4"

# Available filesystem types for user selection
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs

# Initial selection for partitioning method
# Options: none, erase, replace, alongside, manual
# "erase" allows automatic "Erase disk" to work out of the box
initialPartitioningChoice: erase

# Initial swap selection
# Options: none, small, suspend, file
initialSwapChoice: small

# Swap partition choices available to user
userSwapChoices:
    - none
    - small
    - suspend
    - file

# Allow manual partitioning
allowManualPartitioning: true

# Draw nested subvolumes (for btrfs)
drawNestedPartitions: false

# Always create swap partition (recommended for hibernation support)
alwaysShowPartitionLabels: true

# LUKS encryption settings
# Use luks1 for GRUB compatibility (GRUB has limited luks2 support)
luksGeneration: luks1

# Required storage size (GiB) - minimum disk size for installation
requiredStorage: 8.0
