# Calamares partition module configuration for Osiris OS
---

# EFI System Partition configuration
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 64MiB
    label: "EFI"

# Default filesystem for new partitions
defaultFileSystemType: "ext4"

# Available filesystem types
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs

# Initial partitioning choice
initialPartitioningChoice: erase

# Swap settings
initialSwapChoice: small
userSwapChoices:
    - none
    - small
    - suspend
    - file

# Allow manual partitioning
allowManualPartitioning: true

# LUKS encryption
luksGeneration: luks1

# Minimum disk size (GiB)
requiredStorage: 8.0
