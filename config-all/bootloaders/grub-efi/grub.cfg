set default=0
set timeout=5

# Load graphics
if loadfont /boot/grub/unicode.pf2 ; then
  set gfxmode=1024x768x32,auto
  insmod gfxterm
  insmod png
  insmod efi_gop
  insmod efi_uga

  # Set background image (try multiple paths)
  if background_image /boot/grub/splash.png ; then
    set color_normal=white/black
    set color_highlight=yellow/black
  elif background_image /isolinux/splash.png ; then
    set color_normal=white/black
    set color_highlight=yellow/black
  else
    set menu_color_normal=cyan/blue
    set menu_color_highlight=white/blue
  fi
fi

terminal_output gfxterm

# Menu entries
menuentry "Osiris OS (Live)" {
  linux /live/vmlinuz boot=live components quiet splash plymouth.ignore-serial-consoles
  initrd /live/initrd.img
}

menuentry "Osiris OS (Live - Safe Mode)" {
  linux /live/vmlinuz boot=live components nomodeset
  initrd /live/initrd.img
}

menuentry "Osiris OS (Live - Failsafe)" {
  linux /live/vmlinuz boot=live components noapic noacpi nodma nomce nolapic nosmp
  initrd /live/initrd.img
}
