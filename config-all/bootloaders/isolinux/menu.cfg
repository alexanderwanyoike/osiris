label live
  menu label ^Osiris OS (Live)
  menu default
  linux /live/vmlinuz
  append initrd=/live/initrd.img boot=live components quiet splash

label live-safe
  menu label Osiris OS (Live - Safe Mode)
  linux /live/vmlinuz
  append initrd=/live/initrd.img boot=live components nomodeset

label live-failsafe
  menu label Osiris OS (Live - Failsafe)
  linux /live/vmlinuz
  append initrd=/live/initrd.img boot=live components noapic noacpi nodma nomce nolapic nosmp

label install
  menu label ^Install Osiris OS
  linux /install/vmlinuz
  append initrd=/install/initrd.gz

label install-text
  menu label Install Osiris OS (Text Mode)
  linux /install/vmlinuz
  append initrd=/install/initrd.gz priority=critical
