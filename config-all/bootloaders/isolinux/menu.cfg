label live
  menu label ^Osiris OS (Live)
  menu default
  linux /live/vmlinuz
  append initrd=/live/initrd.img boot=live components quiet splash plymouth.ignore-serial-consoles vga=791

label live-safe
  menu label Osiris OS (Live - Safe Mode)
  linux /live/vmlinuz
  append initrd=/live/initrd.img boot=live components nomodeset

label live-failsafe
  menu label Osiris OS (Live - Failsafe)
  linux /live/vmlinuz
  append initrd=/live/initrd.img boot=live components noapic noacpi nodma nomce nolapic nosmp
