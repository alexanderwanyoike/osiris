name: CI

# Tests and static analysis only. Building an ISO needs root, loop mounts and
# around 8GB of scratch space; it has no business in a pull request check and
# is run from a development machine instead.
on:
  push:
    branches: [main, dev, "refactor/**", "feature/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: System libraries
        # pyparted, which archinstall depends on, builds against libparted;
        # the shipped Skins' contrast is tested on sheets compiled with sassc.
        run: sudo apt-get update && sudo apt-get install -y libparted-dev pkg-config sassc

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Architecture contracts
        run: lint-imports

      - name: Dead code
        run: vulture

      - name: Tests
        run: pytest --cov --cov-report=term-missing
